[project]
name = "lead-brief"
version = "0.1.0"
description = "Prototype pre-call brief agent for SDRs, with an eval harness."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lead_brief = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
